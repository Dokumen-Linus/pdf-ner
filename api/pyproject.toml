[project]
name = "dokumen-api"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi[standard]",
  "asyncpg",
  "pydantic-settings",
  "anthropic",
  "openai",
  "google-genai",
  "dokumen-llm-providers",
  "redis",
  "celery",
  "boto3",
  "dokumen-aws-secrets",
  "pdf-ocr-utils",
  "pdfium-utils",
  "otel-py",
]

[project.optional-dependencies]
dev = [
  "ruff",
  "deptry",
  "pytest",
  "pytest-anyio",
  "pytest-mock",
  "pytest-cov",
  "httpx",
]

[tool.ruff]
line-length = 100
target-version = "py313"

include = ["**/*.py"]
exclude = [
  "**/.venv/",
  ".venv/",
  "__pycache__/",
  "**/__pycache__/",
]

[tool.ruff.lint]
select = [
  "E",   # pycodestyle
  "F",   # Pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]
ignore = [
  "E501",  # let the formatter handle line length
]

[tool.ruff.lint.isort]
known-first-party = ["app", "tests"]
force-sort-within-sections = true

[tool.ruff.lint.flake8-unused-arguments]
ignore-variadic-names = true

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/conftest.py" = ["E402"]  # env vars must be set before app imports
"**/router.py" = ["B008"]  # FastAPI Depends() in function defaults
"**/db.py" = ["B008"]  # FastAPI Depends() in function defaults

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "--cov"

[tool.uv.sources]
dokumen-llm-providers = { path = "../packages/llm_providers" }
pdf-ocr-utils = { path = "../packages/pdf_ocr_utils" }
pdfium-utils = { path = "../packages/pdfium_utils" }
otel-py = { path = "../packages/otel_py" }
dokumen-aws-secrets = { path = "../packages/aws_secrets_config" }

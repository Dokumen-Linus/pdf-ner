[project]
name = "pdfium-utils"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "pypdfium2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["pdfium_utils*"]

line-length = 100
target-version = "py313"
include = ["**/*.py"]

exclude = [
  "**/.claude/",
  "**/.venv/",
  ".venv/",
  "__pycache__/",
  "**/__pycache__/",
  "*.ipynb",
  "*.pyc",
]

[lint]
select = [
  "E",   # pycodestyle
  "F",   # Pyflakes
  "W",   # pycodestyle warnings
  "I",   # isort
  "UP",  # pyupgrade
  "B",   # flake8-bugbear
]

ignore = [
  "E501",  # line length — let the formatter handle it
]

[lint.isort]
known-first-party = ["app", "tests"]
force-sort-within-sections = true

[lint.flake8-unused-arguments]
ignore-variadic-names = true

[lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/conftest.py" = ["E402"]   # env vars must be set before app imports
"**/router.py" = ["B008"]        # FastAPI Depends() in function defaults

[format]
quote-style = "double"
indent-style = "space"
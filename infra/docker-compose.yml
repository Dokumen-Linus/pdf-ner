services:
  db:
    build:
      context: ../db
    environment:
      POSTGRES_DB: dokumen
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Role passwords — injected into db/init/01_roles.sh
      OWNER_ROLE_PASSWORD: ${OWNER_ROLE_PASSWORD}
      AUTH_ROLE_PASSWORD: ${AUTH_ROLE_PASSWORD}
      WEB_USER_PASSWORD: ${WEB_USER_PASSWORD}
      API_USER_PASSWORD: ${API_USER_PASSWORD}
      WORKERS_USER_PASSWORD: ${WORKERS_USER_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d dokumen"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis_data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ../api
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - ../api/.env
    environment:
      API_DATABASE_URL: postgres://api_user:${API_USER_PASSWORD}@db:5432/dokumen?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

  worker:
    build:
      context: ../workers
      dockerfile: Dockerfile
    env_file:
      - ../workers/.env
    environment:
      WORKERS_DATABASE_URL: postgres://workers_user:${WORKERS_USER_PASSWORD}@db:5432/dokumen?sslmode=disable
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - backend
    restart: unless-stopped

  web:
    build:
      context: ../web
      args:
        # Baked into the client bundle at build time
        VITE_STRIPE_PUBLISHABLE_KEY: ${VITE_STRIPE_PUBLISHABLE_KEY}
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://owner_role:${OWNER_ROLE_PASSWORD}@db:5432/dokumen?sslmode=disable
      AUTH_DATABASE_URL: postgres://auth_role:${AUTH_ROLE_PASSWORD}@db:5432/dokumen?sslmode=disable
      WEB_DATABASE_URL: postgres://web_user:${WEB_USER_PASSWORD}@db:5432/dokumen?sslmode=disable
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL}
      RESEND_API_KEY: ${RESEND_API_KEY}
      FROM_EMAIL: ${FROM_EMAIL}
      MY_EMAIL: ${MY_EMAIL}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - frontend
    restart: unless-stopped

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
    internal: true

volumes:
  postgres_data:
  redis_data:

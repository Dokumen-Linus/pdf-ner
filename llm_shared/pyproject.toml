[project]
name = "dokumen-llm-shared"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
  "anthropic",
  "openai",
  "google-genai",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["dokumen_llm_shared*"]

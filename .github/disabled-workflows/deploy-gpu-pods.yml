name: Deploy GPU Pods

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Immutable image tag to deploy. Defaults to the commit SHA."
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - "gpu/**"
      - "infra/runpod/**"
      - ".github/workflows/deploy-gpu-pods.yml"

concurrency:
  group: deploy-gpu-pods
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
  DEEPSEEK_ECR_REPOSITORY: ${{ vars.GPU_DEEPSEEK_ECR_REPOSITORY || 'dokumen-deepseek-ocr' }}
  OLM_OCR2_ECR_REPOSITORY: ${{ vars.GPU_OLM_OCR2_ECR_REPOSITORY || 'dokumen-olm-ocr2' }}
  DEEPSEEK_RUNPOD_POD_ID: ${{ vars.DEEPSEEK_RUNPOD_POD_ID }}
  OLM_OCR2_RUNPOD_POD_ID: ${{ vars.OLM_OCR2_RUNPOD_POD_ID }}
  RUNPOD_GPU_TYPE: ${{ vars.RUNPOD_GPU_TYPE || 'NVIDIA GeForce RTX 5090' }}
  RUNPOD_GPU_COUNT: ${{ vars.RUNPOD_GPU_COUNT || '1' }}
  RUNPOD_CLOUD_TYPE: ${{ vars.RUNPOD_CLOUD_TYPE || 'SECURE' }}
  RUNPOD_DATA_CENTER_IDS: ${{ vars.RUNPOD_DATA_CENTER_IDS }}
  CONTAINER_DISK_GB: ${{ vars.GPU_CONTAINER_DISK_GB || '80' }}
  VOLUME_GB: ${{ vars.GPU_VOLUME_GB || '120' }}
  VOLUME_MOUNT_PATH: /workspace
  PORT: "8000"
  PORT_HEALTH: "8000"

jobs:
  deploy:
    name: Build ECR Images And Update Runpod Pods
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Install runpodctl
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -sL https://github.com/runpod/runpodctl/releases/download/v2.3.0/runpodctl-linux-amd64.tar.gz \
            | tar xz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy GPU Pods
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          OCR_HTTP_BEARER_TOKEN: ${{ secrets.OCR_HTTP_BEARER_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: bash infra/runpod/runpod-deploy-pods.sh

      - name: Smoke test GPU Pods
        env:
          RUNPOD_API_KEY: ${{ secrets.RUNPOD_API_KEY }}
          OCR_HTTP_BEARER_TOKEN: ${{ secrets.OCR_HTTP_BEARER_TOKEN }}
        run: bash infra/runpod/test-pods.sh

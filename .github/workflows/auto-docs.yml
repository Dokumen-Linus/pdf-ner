name: Changelog and Wiki

on:
  pull_request:
    branches: [ master ]
    types: [ closed ]

permissions:
  contents: write
  pull-requests: read

jobs:
  changelog:
    name: Generate changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Generate changelog
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Generate wiki
        run: npx -y codesight --wiki

      - name: Commit changelog
        if: github.event.pull_request.merged == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md .codesight/wiki/
          if ! git diff --cached --quiet; then
            git commit -m "chore(changelog): update CHANGELOG.md and .codesight/wiki [skip ci]"
            git pull --rebase --autostash
            git push
          fi
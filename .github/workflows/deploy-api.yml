name: Deploy API

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "api/**"
      - "packages/**"
      - "infra/docker-compose.yml"
      - "infra/aws/health/**"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: deploy-api
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY || 'dokumen-api' }}
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/dokumen/pdf-ner' }}
  EC2_DEPLOY_STATE_DIR: ${{ vars.EC2_DEPLOY_STATE_DIR || '/opt/dokumen/deploy-state' }}

jobs:
  deploy:
    name: Build, Push, And Restart API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" >/dev/null 2>&1 \
            || aws ecr create-repository \
              --repository-name "$ECR_REPOSITORY" \
              --encryption-configuration encryptionType=AES256 \
              --image-scanning-configuration scanOnPush=true \
              >/dev/null

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy API on EC2
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          jq -n \
            --arg region "$AWS_REGION" \
            --arg app_dir "$EC2_APP_DIR" \
            --arg state_dir "$EC2_DEPLOY_STATE_DIR" \
            --arg image "$IMAGE" \
            --arg registry "${{ steps.ecr-login.outputs.registry }}" \
            --arg service "api" \
            --arg sha "${{ github.sha }}" \
            '{
              commands: [
                "set -euo pipefail",
                "cd \($app_dir)",
                "git fetch origin master",
                "git checkout --detach \($sha)",
                "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
                "STATE_DIR=\($state_dir)",
                "IMAGE=\($image)",
                "SERVICE=\($service)",
                "install -d -m 0755 \"$STATE_DIR/images\"",
                "printf '\''%s\\n'\'' \"$IMAGE\" > \"$STATE_DIR/images/$SERVICE\"",
                "{ echo '\''services:'\''; for service in web api worker; do image_file=\"$STATE_DIR/images/$service\"; if [ -s \"$image_file\" ]; then echo \"  $service:\"; printf '\''    image: %s\\n'\'' \"$(cat \"$image_file\")\"; fi; done; } > \"$STATE_DIR/docker-compose.images.yml\"",
                "docker compose -f infra/docker-compose.yml -f \"$STATE_DIR/docker-compose.images.yml\" --env-file infra/.env.prod pull \"$SERVICE\"",
                "docker compose -f infra/docker-compose.yml -f \"$STATE_DIR/docker-compose.images.yml\" --env-file infra/.env.prod up -d --no-build --no-deps \"$SERVICE\"",
                "bash infra/aws/health/ec2-healthcheck.sh",
                "docker image prune -f"
              ]
            }' > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy API ${{ github.sha }}" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}" \
            --output json

name: Deploy API

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths:
      - "api/**"
      - "packages/**"
      - "infra/docker-compose.yml"
      - ".github/workflows/deploy-api.yml"

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY || 'dokumen-api' }}
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/dokumen/pdf-ner' }}
  EC2_DEPLOY_STATE_DIR: ${{ vars.EC2_DEPLOY_STATE_DIR || '/opt/dokumen/deploy-state' }}
  IMAGE_TAG: ${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    name: Build, Push, And Restart API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}

      - name: Deploy API on EC2
        env:
          IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ env.IMAGE_TAG }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
          SERVICE: api
        run: |
          run_ssm_command() {
            local label="$1"
            local remote_command="$2"
            local encoded_command
            local command_id
            local wait_status

            encoded_command="$(printf '%s' "$remote_command" | base64 -w 0)"

            echo "::group::${label}"
            command_id="$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy API ${{ github.sha }}: ${label}" \
              --parameters "commands=printf %s $encoded_command | base64 -d | bash" \
              --query "Command.CommandId" \
              --output text)"
            echo "SSM command id: ${command_id}"

            set +e
            aws ssm wait command-executed \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID"
            wait_status=$?
            set -e

            echo "Status:"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text
            echo "Stdout:"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text
            echo "Stderr:"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            echo "::endgroup::"

            if (( wait_status != 0 )); then
              exit "$wait_status"
            fi
          }

          run_ssm_command \
            "Log in to ECR" \
            "set -euo pipefail; aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY"

          run_ssm_command \
            "Write Compose image override" \
            "set -euo pipefail; STATE_DIR=$EC2_DEPLOY_STATE_DIR; SERVICE=$SERVICE; IMAGE=$IMAGE; install -d -m 0755 \$STATE_DIR \$STATE_DIR/images; echo \$IMAGE > \$STATE_DIR/images/\$SERVICE; echo services: > \$STATE_DIR/docker-compose.images.yml; if test -s \$STATE_DIR/images/web; then image=\$(cat \$STATE_DIR/images/web); echo \\ \\ web: >> \$STATE_DIR/docker-compose.images.yml; echo \\ \\ \\ \\ image: \$image >> \$STATE_DIR/docker-compose.images.yml; fi; if test -s \$STATE_DIR/images/api; then image=\$(cat \$STATE_DIR/images/api); echo \\ \\ api: >> \$STATE_DIR/docker-compose.images.yml; echo \\ \\ \\ \\ image: \$image >> \$STATE_DIR/docker-compose.images.yml; fi; if test -s \$STATE_DIR/images/worker; then image=\$(cat \$STATE_DIR/images/worker); echo \\ \\ worker: >> \$STATE_DIR/docker-compose.images.yml; echo \\ \\ \\ \\ image: \$image >> \$STATE_DIR/docker-compose.images.yml; fi"

          run_ssm_command \
            "Pull API image" \
            "set -euo pipefail; cd $EC2_APP_DIR; docker compose -f infra/docker-compose.yml -f $EC2_DEPLOY_STATE_DIR/docker-compose.images.yml --env-file infra/.env.prod pull api"

          run_ssm_command \
            "Start API service" \
            "set -euo pipefail; cd $EC2_APP_DIR; docker compose -f infra/docker-compose.yml -f $EC2_DEPLOY_STATE_DIR/docker-compose.images.yml --env-file infra/.env.prod up -d --no-build --no-deps api"

          run_ssm_command \
            "Prune dangling images" \
            "set -euo pipefail; docker image prune -f"

name: Auto Format

on:
  pull_request:
    branches: [ master ]
    types: [ closed ]

permissions:
  contents: write
  pull-requests: read

jobs:
  format:
    name: Format code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Format Python files
        run: ruff format

      - name: Format web dir with prettier
        run: cd web && npm run prettier:fix

      - name: Format web dir with eslint
        run: cd web && npm run lint:fix

      - name: Commit formatting changes
        if: github.event.pull_request.merged == true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "style: auto-format code [skip ci]"
          git push
name: EC2 Healthcheck

on:
  workflow_dispatch:

concurrency:
  group: production-healthcheck
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/dokumen/pdf-ner' }}

jobs:
  healthcheck:
    name: Wait And Run EC2 Healthcheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run healthcheck on EC2
        run: |
          REMOTE_COMMAND="set -euo pipefail; cd $EC2_APP_DIR; bash infra/aws/health/ec2-healthcheck.sh"
          ENCODED_COMMAND="$(printf '%s' "$REMOTE_COMMAND" | base64 -w 0)"

          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Run EC2 healthcheck" \
            --parameters "commands=printf %s $ENCODED_COMMAND | base64 -d | bash" \
            --query "Command.CommandId" \
            --output text)"

          set +e
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID"
          WAIT_STATUS=$?
          set -e

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}" \
            --output json

          exit "$WAIT_STATUS"

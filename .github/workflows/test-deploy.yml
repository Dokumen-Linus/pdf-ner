name: Test Deploy Existing Images

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Existing ECR image tag to deploy for web, api, and workers
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY || 'dokumen-api' }}
  WEB_ECR_REPOSITORY: ${{ vars.WEB_ECR_REPOSITORY || 'dokumen-web' }}
  WORKERS_ECR_REPOSITORY: ${{ vars.WORKERS_ECR_REPOSITORY || 'dokumen-workers' }}
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/dokumen/pdf-ner' }}
  EC2_DEPLOY_STATE_DIR: ${{ vars.EC2_DEPLOY_STATE_DIR || '/opt/dokumen/deploy-state' }}

jobs:
  deploy:
    name: Deploy Existing Images To EC2
    runs-on: ubuntu-latest
    permissions:
      id-token: write

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Deploy existing images on EC2
        env:
          WEB_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.WEB_ECR_REPOSITORY }}:${{ inputs.image_tag }}
          API_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:${{ inputs.image_tag }}
          WORKER_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.WORKERS_ECR_REPOSITORY }}:${{ inputs.image_tag }}
          ECR_REGISTRY: ${{ steps.ecr-login.outputs.registry }}
          EC2_INSTANCE_ID: ${{ secrets.EC2_INSTANCE_ID }}
        run: |
          run_ssm_command() {
            local label="$1"
            local remote_command="$2"
            local command_id
            local wait_status

            echo "::group::${label}"
            command_id="$(aws ssm send-command \
              --instance-ids "$EC2_INSTANCE_ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Test deploy existing images: ${label}" \
              --parameters "commands=$remote_command" \
              --query "Command.CommandId" \
              --output text)"
            echo "SSM command id: ${command_id}"

            set +e
            aws ssm wait command-executed \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID"
            wait_status=$?
            set -e

            echo "Status:"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text
            echo "Stdout:"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardOutputContent" \
              --output text
            echo "Stderr:"
            aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "StandardErrorContent" \
              --output text
            echo "::endgroup::"

            if (( wait_status != 0 )); then
              exit "$wait_status"
            fi
          }

          run_ssm_command \
            "Log in to ECR" \
            "set -euo pipefail; aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY"

          run_ssm_command \
            "Write Compose image override" \
            "set -euo pipefail; STATE_DIR=$EC2_DEPLOY_STATE_DIR; install -d -m 0755 \$STATE_DIR \$STATE_DIR/images; echo $WEB_IMAGE > \$STATE_DIR/images/web; echo $API_IMAGE > \$STATE_DIR/images/api; echo $WORKER_IMAGE > \$STATE_DIR/images/worker; echo services: > \$STATE_DIR/docker-compose.images.yml; echo \\ \\ web: >> \$STATE_DIR/docker-compose.images.yml; echo \\ \\ \\ \\ image: $WEB_IMAGE >> \$STATE_DIR/docker-compose.images.yml; echo \\ \\ api: >> \$STATE_DIR/docker-compose.images.yml; echo \\ \\ \\ \\ image: $API_IMAGE >> \$STATE_DIR/docker-compose.images.yml; echo \\ \\ worker: >> \$STATE_DIR/docker-compose.images.yml; echo \\ \\ \\ \\ image: $WORKER_IMAGE >> \$STATE_DIR/docker-compose.images.yml"

          run_ssm_command \
            "Pull stack images" \
            "set -euo pipefail; cd $EC2_APP_DIR; docker compose -f infra/docker-compose.yml -f $EC2_DEPLOY_STATE_DIR/docker-compose.images.yml --env-file infra/.env.prod pull web api worker"

          run_ssm_command \
            "Start stack services" \
            "set -euo pipefail; cd $EC2_APP_DIR; docker compose -f infra/docker-compose.yml -f $EC2_DEPLOY_STATE_DIR/docker-compose.images.yml --env-file infra/.env.prod up -d --no-build redis api worker web"

          run_ssm_command \
            "Prune dangling images" \
            "set -euo pipefail; docker image prune -f"

name: Deploy Stack

on:
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  API_ECR_REPOSITORY: ${{ vars.API_ECR_REPOSITORY || 'dokumen-api' }}
  WEB_ECR_REPOSITORY: ${{ vars.WEB_ECR_REPOSITORY || 'dokumen-web' }}
  WORKERS_ECR_REPOSITORY: ${{ vars.WORKERS_ECR_REPOSITORY || 'dokumen-workers' }}
  EC2_APP_DIR: ${{ vars.EC2_APP_DIR || '/opt/dokumen/pdf-ner' }}
  EC2_DEPLOY_STATE_DIR: ${{ vars.EC2_DEPLOY_STATE_DIR || '/opt/dokumen/deploy-state' }}

jobs:
  deploy:
    name: Build, Push, And Deploy Stack
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate web build variables
        env:
          VITE_BASE_URL: ${{ vars.VITE_BASE_URL }}
          VITE_STRIPE_PUBLISHABLE_KEY: ${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
        run: |
          require_real_value() {
            local name="$1"
            local value="${!name:-}"

            case "$value" in
              ""|REPLACE_*|YOUR_*|TODO|TODO_*|CHANGE_ME|changeme|"<"*">")
                echo "::error::${name} must be set to a real GitHub Actions repository variable."
                exit 1
                ;;
            esac
          }

          require_real_value VITE_BASE_URL
          require_real_value VITE_STRIPE_PUBLISHABLE_KEY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Ensure ECR repositories exist
        run: |
          for repository in "$WEB_ECR_REPOSITORY" "$API_ECR_REPOSITORY" "$WORKERS_ECR_REPOSITORY"; do
            aws ecr describe-repositories --repository-names "$repository" >/dev/null 2>&1 \
              || aws ecr create-repository \
                --repository-name "$repository" \
                --encryption-configuration encryptionType=AES256 \
                --image-scanning-configuration scanOnPush=true \
                >/dev/null
          done

      - name: Log in to ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: web
          file: web/Dockerfile
          push: true
          build-args: |
            VITE_BASE_URL=${{ vars.VITE_BASE_URL }}
            VITE_STRIPE_PUBLISHABLE_KEY=${{ vars.VITE_STRIPE_PUBLISHABLE_KEY }}
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.WEB_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Build and push workers image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: workers/Dockerfile
          push: true
          tags: ${{ steps.ecr-login.outputs.registry }}/${{ env.WORKERS_ECR_REPOSITORY }}:${{ github.sha }}

      - name: Deploy stack on EC2
        env:
          WEB_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.WEB_ECR_REPOSITORY }}:${{ github.sha }}
          API_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.API_ECR_REPOSITORY }}:${{ github.sha }}
          WORKER_IMAGE: ${{ steps.ecr-login.outputs.registry }}/${{ env.WORKERS_ECR_REPOSITORY }}:${{ github.sha }}
        run: |
          jq -n \
            --arg region "$AWS_REGION" \
            --arg app_dir "$EC2_APP_DIR" \
            --arg state_dir "$EC2_DEPLOY_STATE_DIR" \
            --arg registry "${{ steps.ecr-login.outputs.registry }}" \
            --arg sha "${{ github.sha }}" \
            --arg web_image "$WEB_IMAGE" \
            --arg api_image "$API_IMAGE" \
            --arg worker_image "$WORKER_IMAGE" \
            '{
              commands: [
                "set -euo pipefail",
                "cd \($app_dir)",
                "git fetch origin master",
                "git checkout --detach \($sha)",
                "aws ecr get-login-password --region \($region) | docker login --username AWS --password-stdin \($registry)",
                "STATE_DIR=\($state_dir)",
                "install -d -m 0755 \"$STATE_DIR\" \"$STATE_DIR/images\"",
                "printf '\''%s\\n'\'' \($web_image | @sh) > \"$STATE_DIR/images/web\"",
                "printf '\''%s\\n'\'' \($api_image | @sh) > \"$STATE_DIR/images/api\"",
                "printf '\''%s\\n'\'' \($worker_image | @sh) > \"$STATE_DIR/images/worker\"",
                "{ echo '\''services:'\''; for service in web api worker; do image_file=\"$STATE_DIR/images/$service\"; echo \"  $service:\"; printf '\''    image: %s\\n'\'' \"$(cat \"$image_file\")\"; done; } > \"$STATE_DIR/docker-compose.images.yml\"",
                "docker compose -f infra/docker-compose.yml -f \"$STATE_DIR/docker-compose.images.yml\" --env-file infra/.env.prod pull web api worker",
                "docker compose -f infra/docker-compose.yml -f \"$STATE_DIR/docker-compose.images.yml\" --env-file infra/.env.prod up -d --no-build redis api worker web",
                "bash infra/aws/health/ec2-healthcheck.sh",
                "docker image prune -f"
              ]
            }' > ssm-commands.json

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "${{ secrets.EC2_INSTANCE_ID }}" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy stack ${{ github.sha }}" \
            --parameters file://ssm-commands.json \
            --query "Command.CommandId" \
            --output text)

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "${{ secrets.EC2_INSTANCE_ID }}" \
            --query "{Status:Status,StandardOutput:StandardOutputContent,StandardError:StandardErrorContent}" \
            --output json
